# Free deploy on Render: New + > Blueprint > pick this repo.
# Data lives in a free Neon Postgres database: paste its connection string
# into DATABASE_URL when Render asks (Render's free tier has no persistent disk).
services:
  - type: web
    name: study-tracker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_DATABASE_URL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
